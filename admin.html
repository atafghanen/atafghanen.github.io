<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AT Evening Elegance – Admin</title>

  <link rel="stylesheet" href="admin.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1>AT Evening Elegance</h1>
    <p>Admin-Bereich</p>

    <form id="loginForm">
      <label>
        E-Mail
        <input id="loginEmail" type="email" required>
      </label>

      <label>
        Passwort
        <input id="loginPassword" type="password" required>
      </label>

      <button type="submit" class="gold">Anmelden</button>

      <p id="loginError" class="error"></p>
    </form>
  </div>
</div>

<div id="adminApp" hidden>

<header>
  <a href="index.html">← Website</a>

  <h1>
    AT Evening Elegance
    <em>Admin</em>
  </h1>

  <button id="logoutBtn">Abmelden</button>
</header>

<main>

<section class="card">
  <h2>Website</h2>

  <div class="form-grid">

    <label>
      Instagram
      <input id="instagram">
    </label>

    <label>
      TikTok
      <input id="tiktok">
    </label>

    <label>
      E-Mail
      <input id="email">
    </label>

    <label>
      WhatsApp Nummer
      <input id="whatsapp" placeholder="491701234567">
    </label>

    <label>
      Logo
      <input id="logoFile" type="file" accept="image/*,.gif">
    </label>

  </div>

  <button id="saveSettings" class="gold">
    Website speichern
  </button>
</section>

<section class="card">
  <div class="section-top">
    <div>
      <h2>Kategorien</h2>
      <p>Eigene Kategorien für deine Produkte.</p>
    </div>

    <button id="addCategory" class="gold">
      + Kategorie
    </button>
  </div>

  <div id="categories"></div>
</section>

<section class="card">
  <div class="section-top">
    <div>
      <h2>Produkte</h2>
      <p>Produkte hinzufügen, bearbeiten oder löschen.</p>
    </div>

    <button id="addProduct" class="gold">
      + Produkt
    </button>
  </div>

  <div id="products"></div>
</section>

<section class="card">
  <div class="section-top">
    <div>
      <h2>Galerie</h2>
      <p>Bilder direkt hochladen und verwalten.</p>
    </div>

    <button id="addGallery" class="gold">
      + Bild
    </button>
  </div>

  <div id="gallery"></div>
</section>

<section class="card">
  <div class="section-top">
    <div>
      <h2>Videos</h2>
      <p>Videos für deine Website verwalten.</p>
    </div>

    <button id="addVideo" class="gold">
      + Video
    </button>
  </div>

  <div id="videos"></div>
</section>

<section class="card">
  <h2>Bestellungen</h2>
  <div id="orders"></div>
</section>

</main>
</div>

<script>

const SUPABASE_URL =
  "https://gaxpagykgrcgxebnsyai.supabase.co";

/*
  HIER DEINEN PUBLISHABLE KEY EINFÜGEN.
  NUR den sb_publishable_... Key verwenden.
*/

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_Cgg8Dun5Sua_VpXj39ahHA_piGaeN8f";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const loginScreen =
  document.querySelector("#loginScreen");

const adminApp =
  document.querySelector("#adminApp");

const loginForm =
  document.querySelector("#loginForm");

const loginError =
  document.querySelector("#loginError");


async function checkLogin() {

  const { data, error } =
    await supabaseClient.auth.getSession();

  if (error) {
    console.error(error);
    return;
  }

  if (data.session) {

    loginScreen.hidden = true;
    adminApp.hidden = false;

    loadAdmin();

  } else {

    loginScreen.hidden = false;
    adminApp.hidden = true;

  }
}


loginForm.addEventListener("submit", async function(e) {

  e.preventDefault();

  loginError.textContent = "";

  const email =
    document.querySelector("#loginEmail").value.trim();

  const password =
    document.querySelector("#loginPassword").value;


  const { error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });


  if (error) {

    loginError.textContent =
      "E-Mail oder Passwort ist falsch.";

    return;
  }


  checkLogin();

});


document
  .querySelector("#logoutBtn")
  .addEventListener("click", async function() {

    await supabaseClient.auth.signOut();

    checkLogin();

  });


async function loadAdmin() {

  console.log("Admin erfolgreich angemeldet.");

}


checkLogin();

</script>

</body>
</html>
